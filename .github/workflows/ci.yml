name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet restore RealTimeHelpdesk.slnx
      - run: dotnet build RealTimeHelpdesk.slnx --no-restore -c Release
      - run: dotnet test tests/Helpdesk.UnitTests/Helpdesk.UnitTests.csproj --no-build -c Release
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: frontend/helpdesk-web/package.json }
      - run: npm ci
        working-directory: frontend/helpdesk-web
      - run: npm run build
        working-directory: frontend/helpdesk-web
